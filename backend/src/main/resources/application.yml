spring:
  application:
    name: yeokjeon-erp-backend
  
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB
  
  devtools:
    livereload:
      enabled: false
    restart:
      enabled: false
  
  datasource:
    url: jdbc:postgresql://localhost:5432/yeokjeon_db
    username: postgres
    password: alsyalsyrla1!
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: Asia/Seoul
    open-in-view: false
  
  jackson:
    time-zone: Asia/Seoul
    serialization:
      write-dates-as-timestamps: false

mybatis:
  # mapper 폴더 아래의 모든 하위 폴더(**) 내의 모든 xml(*)을 읽도록 설정
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 3001
  # 대용량 목록(가맹점 1,000+건 등) JSON 응답 압축 — 전송량 5~10배 절감.
  compression:
    enabled: true
    mime-types: application/json,text/plain,text/html
    min-response-size: 2048
  servlet:
    context-path: /api
    encoding:
      charset: UTF-8
      enabled: true
      force: true

menu:
  permission:
    # 콤마 구분 — DB 권한 없이 전 메뉴 조회 허용
    super-admin-user-ids: admin

external:
  kakao:
    rest-api-key: 15c5f01644e0aa8f06fc80b5afd310da

daou:
  office:
    api-base-url: https://api.daouoffice.com
    client-id: ${DAOU_CLIENT_ID:}
    client-secret: ${DAOU_CLIENT_SECRET:}
    form-code: ${DAOU_FORM_CODE:yeokjeon_eap01}
    callback-url: ${DAOU_CALLBACK_URL:http://localhost:3001/api/eap/status}

yon:
  file:
    storage-root: ${FILE_STORAGE_ROOT:./storage}
    max-size-bytes: ${FILE_MAX_SIZE:52428800}

logging:
  # 콘솔: Windows 기본 MS949(YeokjeonErpApplication). UTF-8 터미널은 LOGGING_CHARSET_CONSOLE=UTF-8
  charset:
    file: UTF-8
  level:
    com.yeokjeon: DEBUG
    com.yeokjeon.erp.common.mapper: DEBUG
    com.yeokjeon.erp.auth.mapper: DEBUG
    com.yeokjeon.erp.master.mapper: DEBUG
    com.yeokjeon.erp.franchise.mapper: DEBUG
    com.yeokjeon.erp.active.mapper: DEBUG
    com.yeokjeon.erp.development.mapper: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

---
# 개발 환경
spring:
  config:
    activate:
      on-profile: dev
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

server:
  port: 3001

---
# 운영 환경
spring:
  config:
    activate:
      on-profile: prod
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

server:
  port: 3001
