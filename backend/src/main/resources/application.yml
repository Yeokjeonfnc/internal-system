spring:
  application:
    name: yeokjeon-erp-backend
  
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB
  
  devtools:
    livereload:
      enabled: false
    restart:
      enabled: false
  
  datasource:
    # 실제 접속 정보는 저장소에 두지 않는다(공개 저장소 유출 방지).
    # 운영: start-backend.ps1 이 config\backend.env 값을 --spring.datasource.* 로 주입한다.
    # 로컬: 환경변수 DB_URL / DB_USER / DB_PASSWORD 를 설정하고 실행한다.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/yeokjeon_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: Asia/Seoul
    open-in-view: false
  
  jackson:
    time-zone: Asia/Seoul
    serialization:
      write-dates-as-timestamps: false

mybatis:
  # mapper 폴더 아래의 모든 하위 폴더(**) 내의 모든 xml(*)을 읽도록 설정
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 3001
  # 대용량 목록(가맹점 1,000+건 등) JSON 응답 압축 — 전송량 5~10배 절감.
  compression:
    enabled: true
    mime-types: application/json,text/plain,text/html
    min-response-size: 2048
  servlet:
    context-path: /api
    encoding:
      charset: UTF-8
      enabled: true
      force: true

auth:
  token:
    # 로그인 토큰 서명 키 — 반드시 config\backend.env 의 AUTH_TOKEN_SECRET 으로 주입할 것.
    # 미설정 시 기동할 때마다 임의 키가 생성되어 재시작 시 전원 재로그인이 필요하다.
    secret: ${AUTH_TOKEN_SECRET:}
    validity-hours: ${AUTH_TOKEN_VALIDITY_HOURS:12}
  # 신규 계정 생성 시 비밀번호를 비워두거나, 관리자가 "비밀번호 초기화"를 누르면
  # 이 값으로 설정된다. DB 비밀번호와 같은 값을 쓰지 않는 것을 권장 — 하나가
  # 유출되면 둘 다 위험해진다.
  default-password: ${DEFAULT_USER_PASSWORD:durwjs1982}

menu:
  permission:
    # 콤마 구분 — DB 권한 없이 전 메뉴 조회 허용
    super-admin-user-ids: admin

external:
  kakao:
    # 저장소에 키를 두지 않는다 — 환경변수 KAKAO_REST_API_KEY 로 주입.
    rest-api-key: ${KAKAO_REST_API_KEY:}

daou:
  office:
    api-base-url: https://api.daouoffice.com
    client-id: ${DAOU_CLIENT_ID:}
    client-secret: ${DAOU_CLIENT_SECRET:}
    form-code: ${DAOU_FORM_CODE:yeokjeon_eap01}
    callback-url: ${DAOU_CALLBACK_URL:http://localhost:3001/api/eap/status}

yon:
  file:
    storage-root: ${FILE_STORAGE_ROOT:./storage}
    max-size-bytes: ${FILE_MAX_SIZE:52428800}

logging:
  # 콘솔: Windows 기본 MS949(YeokjeonErpApplication). UTF-8 터미널은 LOGGING_CHARSET_CONSOLE=UTF-8
  charset:
    file: UTF-8
  level:
    # 주의: mapper DEBUG + BasicBinder TRACE 를 켜면 SQL 바인딩 값이 그대로 로그에 남는다.
    # (로그인 쿼리의 비밀번호·개인정보 포함) 로컬 디버깅이 필요할 때만 임시로 올릴 것.
    com.yeokjeon: ${LOG_LEVEL_APP:INFO}
    org.hibernate.SQL: ${LOG_LEVEL_SQL:WARN}
    org.hibernate.type.descriptor.sql.BasicBinder: ${LOG_LEVEL_SQL_PARAMS:WARN}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

---
# 개발 환경
spring:
  config:
    activate:
      on-profile: dev
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

server:
  port: 3001

---
# 운영 환경
spring:
  config:
    activate:
      on-profile: prod
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

server:
  port: 3001
