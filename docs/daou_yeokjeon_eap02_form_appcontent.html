<!--
  yeokjeon_eap02 연동용 양식 (본문 = OpenAPI content 슬롯)

  ★ 절대 하면 안 되는 것
  - Ver.7 전체(표·{{text}}·{{cSel}} 수십 개)를 이 HTML 탭에 통째 넣지 말 것
    → OpenAPI content 는 data-id="appContent" 에만 붙음. 필드마다 {{text}} 쓰면
      ERP가 보낸 표가 안 보이거나, 디자인 저장 시 attributes 가 깨짐.
  - data-id 값이 아래처럼 깨지면 content 가 안 들어감:
      data-id="appContent&gt;&lt;br&gt;&lt;/div&gt;..."  ← 잘못됨
      data-id="appContent"                            ← 올바름

  사용법:
  1) 다우 Site Admin → 결재 양식 → yeokjeon_eap02 → HTML 탭
  2) 기존 내용 전부 삭제 → 이 파일 전체 붙여넣기 → 저장
  3) 디자인 탭 갔다가 HTML로 돌아와 data-id="appContent" 가 표 본문 칸에
     「한 번만」 그대로인지 확인 (깨졌으면 다시 2번)

  ERP 쪽: eap_transfer_form.html 에서 작성 → Ver.7 표 HTML 이 content 로
  이 appContent 슬롯(표 안쪽 위)에 삽입됨.
-->
