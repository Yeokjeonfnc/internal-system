<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>출입 위치</title>
  <script>
    (function () {
      const key = window.YJ_KAKAO_MAP_APP_KEY
        || window.localStorage.getItem('YJ_KAKAO_MAP_APP_KEY')
        || '';
      if (!key) {
        window.__kakaoSdkLoadPromise = Promise.reject(new Error('KAKAO_MAP_KEY_EMPTY'));
        return;
      }
      const url = 'https://dapi.kakao.com/v2/maps/sdk.js'
        + '?appkey=' + encodeURIComponent(key)
        + '&autoload=false&libraries=services';
      window.__kakaoSdkLoadPromise = new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = url;
        script.onload = () => {
          if (window.kakao && window.kakao.maps) resolve();
          else reject(new Error('KAKAO_SDK_OBJECT_MISSING'));
        };
        script.onerror = () => reject(new Error('KAKAO_SCRIPT_NETWORK'));
        document.head.appendChild(script);
      });
    })();
  </script>
  <style>
    html, body { height: 100%; margin: 0; background: #e8eaed; }
    #map { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    const MSG_PREFIX = 'yj_se_v1|';
    let map = null;
    let marker = null;
    let geocoder = null;
    let current = null;

    function post(msg) {
      const raw = MSG_PREFIX + JSON.stringify(msg);
      try {
        if (typeof YjStoreEntryMap !== 'undefined' && YjStoreEntryMap.postMessage) {
          YjStoreEntryMap.postMessage(raw);
          return;
        }
      } catch (_) {}
    }

    function setCenter(lat, lng) {
      if (!map || !Number.isFinite(lat) || !Number.isFinite(lng)) return;
      const pos = new kakao.maps.LatLng(lat, lng);
      map.setCenter(pos);
      map.setLevel(3);
      if (!marker) {
        marker = new kakao.maps.Marker({ map, position: pos });
      } else {
        marker.setPosition(pos);
      }
      current = { lat, lng };
      if (geocoder) {
        geocoder.coord2Address(lng, lat, (result, status) => {
          let address = '';
          if (status === kakao.maps.services.Status.OK && result && result.length) {
            address = (result[0].road_address && result[0].road_address.address_name)
              || (result[0].address && result[0].address.address_name)
              || '';
          }
          post({ op: 'LOCATION', lat, lng, address });
        });
      } else {
        post({ op: 'LOCATION', lat, lng, address: '' });
      }
    }

    async function boot(lat, lng, appKey) {
      await window.__kakaoSdkLoadPromise;
      await new Promise((resolve) => kakao.maps.load(resolve));
      geocoder = new kakao.maps.services.Geocoder();
      map = new kakao.maps.Map(document.getElementById('map'), {
        center: new kakao.maps.LatLng(lat, lng),
        level: 3,
      });
      setCenter(lat, lng);
      post({ op: 'READY' });
    }

    function dispatch(raw) {
      if (typeof raw !== 'string' || !raw.startsWith(MSG_PREFIX)) return;
      try {
        const msg = JSON.parse(raw.slice(MSG_PREFIX.length));
        if (msg.op === 'INIT') {
          const lat = Number(msg.lat);
          const lng = Number(msg.lng);
          const key = msg.appKey || window.YJ_KAKAO_MAP_APP_KEY || '';
          if (map) setCenter(lat, lng);
          else boot(lat, lng, key);
        }
        if (msg.op === 'SET_CENTER') {
          setCenter(Number(msg.lat), Number(msg.lng));
        }
      } catch (e) {
        console.error(e);
      }
    }
    window.__yjSeDispatch = dispatch;
    post({ op: 'READY' });
  </script>
</body>
</html>
