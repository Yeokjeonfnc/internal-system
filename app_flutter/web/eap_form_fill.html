<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <link rel="stylesheet" href="eap_doc_tables.css?v=20260821r"/>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #E8E8E4; font-family: Pretendard, 'Malgun Gothic', sans-serif; }
    #stage { height: 100%; overflow-x: auto; overflow-y: auto; padding: 4px 0 16px; }
    #page {
      width: 100%; max-width: none; min-width: min(100%, max-content); min-height: 480px; margin: 0 auto; background: #fff;
      box-shadow: 0 1px 8px rgba(0,0,0,.14); padding: 24px 28px;
      font-size: 10pt; line-height: 1.5; color: #212529;
    }
    #page table:not(.eap-excel-import) {
      border-collapse: collapse; max-width: 100%; table-layout: auto; margin: 8px 0;
      box-sizing: border-box;
    }
    #page > table, #page table.eap-tsv { width: 100%; }
    #page table table { width: auto; max-width: 100%; table-layout: auto; }
    #page table.eap-tsv, #page table.eap-editable-table.eap-tsv { table-layout: fixed; }
    #page table:not(.eap-approval-line):not(.eap-tsv) td,
    #page table:not(.eap-approval-line):not(.eap-tsv) th {
      border: 1px solid #333; padding: 6px 8px; vertical-align: middle;
      word-break: keep-all; overflow-wrap: normal;
    }
    #page table.eap-tsv td, #page table.eap-tsv th,
    #page table.eap-editable-table:not(.eap-approval-line) td,
    #page table.eap-editable-table:not(.eap-approval-line) th {
      border: 1px solid #333; padding: 6px 8px; vertical-align: middle;
    }
    #page table.eap-editable-table.eap-tsv td,
    #page table.eap-editable-table.eap-tsv th {
      min-width: 0; overflow: hidden;
    }
    #page table.eap-editable-table td .eap-widget,
    #page table.eap-editable-table th .eap-widget,
    #page table td .eap-widget, #page table th .eap-widget {
      display: inline-block; width: auto; max-width: 100%; margin: 0 2px;
      vertical-align: baseline; box-sizing: border-box;
    }
    #page table td .eap-widget[data-eap-type="multiline"],
    #page table th .eap-widget[data-eap-type="multiline"] {
      display: inline-block; width: 100%; max-width: 100%;
    }
    #page table.eap-form-table { width: 100%; border-collapse: collapse; margin: 6px 0; }
    #page .eap-field td { vertical-align: middle; border: 1px solid #333; padding: 8px; }
    #page .eap-lbl { background: #F2F2F2; font-weight: 600; text-align: center; }
    #page .eap-val { background: #fff; }
    #page .eap-title { text-align: center; font-size: 18pt; font-weight: 700; margin: 0 0 16px; }
    #page .eap-richtext { min-height: 60px; padding: 4px 0; }
    #page input, #page select, #page textarea {
      width: 100%; border: 1px solid #D0D0CC; border-radius: 3px;
      padding: 6px 8px; font: inherit; background: #FAFAFA;
    }
    #page table td input.eap-in-cell, #page table td select.eap-in-cell,
    #page table td textarea.eap-in-cell, #page table th input.eap-in-cell,
    #page table th select.eap-in-cell, #page table th textarea.eap-in-cell {
      width: 100%; max-width: 100%; min-width: 0;
      padding: 2px 4px; font-size: 11px; height: 24px;
      border: 1px solid #BDBDBD; border-radius: 3px; background: #fff;
      text-align: center;
    }
    #page table td input.eap-in-cell::placeholder,
    #page table td textarea.eap-in-cell::placeholder,
    #page table th input.eap-in-cell::placeholder,
    #page table th textarea.eap-in-cell::placeholder {
      text-align: center;
    }
    #page table td textarea.eap-in-cell, #page table th textarea.eap-in-cell {
      height: auto; min-height: 48px; padding: 4px;
    }
    #page table td select.eap-in-cell, #page table th select.eap-in-cell {
      text-align: center;
      text-align-last: center;
    }
    #page table td input[type=date].eap-in-cell, #page table th input[type=date].eap-in-cell {
      width: auto; min-width: 0; max-width: 100%;
    }
    #page input:focus, #page select:focus, #page textarea:focus {
      outline: none; border-color: #BC1F26; background: #fff;
    }
    #page input[readonly] { background: #F5F5F5; color: #555; }
    #page textarea { min-height: 72px; resize: vertical; }
    #page .eap-checks {
      --eap-check-scale: 1;
      display: inline-flex;
      flex-wrap: wrap;
      align-items: center;
      align-content: center;
      gap: 8px 16px;
    }
    #page .eap-checks .eap-check-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      margin: 0;
      line-height: 1.25;
      white-space: nowrap;
    }
    #page .eap-checks .eap-check-lbl {
      display: inline-block;
      line-height: 1.25;
      font-size: calc(10pt * var(--eap-check-scale, 1));
    }
    #page .eap-checks input[type=checkbox],
    #page .eap-checks input[type=radio] {
      margin: 0;
      padding: 0;
      flex: 0 0 auto;
      width: calc(14px * var(--eap-check-scale, 1));
      height: calc(14px * var(--eap-check-scale, 1));
      vertical-align: middle;
    }
    #page table td .eap-checks, #page table th .eap-checks,
    #page table td[colspan] .eap-widget, #page table th[colspan] .eap-widget {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      width: 100%;
      max-width: 100%;
    }
    #page .eap-period { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    #page .eap-period input[type=date] { flex: 0 1 130px; width: auto; min-width: 120px; }
    #page .eap-period-dt select.eap-h, #page .eap-period-dt select.eap-m,
    #page .eap-time select.eap-h, #page .eap-time select.eap-m {
      width: auto; flex: 0 0 48px; padding: 4px 2px;
    }
    #page .eap-u { font-size: 9pt; color: #555; margin-right: 2px; }
    #page .eap-w-tilde { margin: 0 2px; color: #666; font-weight: 600; }
    #page .eap-time { display: inline-flex; align-items: center; gap: 4px; flex-wrap: wrap; }
    #page .eap-widget { display: inline-block; width: auto; max-width: 100%; box-sizing: border-box; vertical-align: baseline; }
    #page .eap-widget > input, #page .eap-widget > select, #page .eap-widget > textarea { width: auto; min-width: 4em; max-width: 100%; }
    #page .eap-picker-row { display: flex; gap: 6px; align-items: center; }
    #page .eap-picker-row input { flex: 1; }
    #page .eap-pick-btn {
      flex: 0 0 auto; height: 32px; padding: 0 12px; border: 1px solid #BC1F26;
      background: #fff; color: #BC1F26; border-radius: 3px; cursor: pointer; font-size: 12px;
    }
    #page .eap-pick-btn:hover { background: #FFF5F5; }
    #page .eap-field.eap-invalid .eap-val { background: #FFF5F5; outline: 1px solid #BC1F26; }
    #page .eap-doc-header { position: relative; min-height: 72px; margin-bottom: 8px; }
    #page .eap-approval-line { position: absolute; top: 0; right: 0; border-collapse: collapse; font-size: 9pt; }
    #page .eap-approval-line td { border: 1px solid #333; padding: 4px 8px; text-align: center; vertical-align: middle; min-width: 36px; height: 28px; }
    #page .eap-appr-lbl { background: #F2F2F2; font-weight: 600; width: 24px; line-height: 1.2; font-size: 8pt; }
    #page .eap-appr-head { background: #F2F2F2; height: 24px; }
    #page .eap-appr-sign { height: 48px; }
    #page .eap-doc-contact { text-align: right; font-size: 9pt; color: #444; margin-bottom: 10px; }
    #page .eap-doc-split { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 12px; }
    #page .eap-doc-logo { flex: 0 0 42%; min-height: 100px; border: 1px solid #E0E0E0; padding: 10px; }
    #page .eap-logo-placeholder { font-size: 16pt; font-weight: 700; color: #BC1F26; margin-bottom: 6px; }
    #page .eap-logo-addr { margin: 0; font-size: 9pt; color: #555; }
    #page .eap-compact-table { flex: 1 1 auto; margin: 0 !important; }
    #page .eap-compact-table .eap-field td { padding: 6px 8px; font-size: 9.5pt; }
    #page .eap-product-wrap { margin: 10px 0; }
    #page .eap-product-toolbar { display: none; }
    #page .eap-product-table { width: 100%; border-collapse: collapse; font-size: 9.5pt; }
    #page .eap-product-table th, #page .eap-product-table td { border: 1px solid #333; padding: 4px; text-align: center; vertical-align: middle; }
    #page .eap-product-table th { background: #F2F2F2; font-weight: 600; }
    #page .eap-grid-field input, #page .eap-grid-field select { width: 100%; min-width: 48px; font-size: 9pt; padding: 4px; }
    #page .eap-doc-notes { border: 1px solid #333; padding: 10px 12px; font-size: 9pt; line-height: 1.6; margin: 12px 0; }
    #page .eap-row-tools { text-align: right; margin: 4px 0; }
    #page .eap-row-plus, #page .eap-row-minus, #page a.button.eap-row-plus, #page a.button.eap-row-minus {
      display: inline-block; margin-left: 4px; padding: 2px 10px; border-radius: 3px;
      background: #666; color: #fff; font-size: 9pt; text-decoration: none; cursor: pointer; border: none;
    }
    /* 편집기에서 저장된 선택·크기조절 잔여물 숨김 */
    #page td.eap-cell-sel, #page th.eap-cell-sel,
    #page td.eap-cell-on, #page th.eap-cell-on {
      outline: none !important; box-shadow: none !important;
    }
  </style>
</head>
<body>
<div id="stage"><div id="page"></div></div>
<script src="eap_doc_tables.js?v=20260821u"></script>
<script src="eap_daou_import.js?v=20260821u"></script>
<script src="eap_form_runtime.js?v=20260821u"></script>
<script src="eap_form_fill.js?v=20260821u"></script>
</body>
</html>
