<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>업무기안</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: #fff;
    font-family: "Malgun Gothic", "맑은 고딕", malgun gothic, dotum, sans-serif;
    font-size: 10pt;
    color: #000;
  }
  #wrap {
    max-width: 800px;
    margin: 0 auto;
    padding: 12px 8px 32px;
  }
  table { border-collapse: collapse; }
  .th {
    background: #dddddd;
    font-weight: bold;
    text-align: center;
    vertical-align: middle;
    border: 1px solid #000;
    padding: 5px;
    font-size: 12px;
  }
  .td {
    border: 1px solid #000;
    padding: 5px;
    vertical-align: middle;
    font-size: 12px;
  }
  .readonly {
    background: #f3f3f3;
    border: 1px solid #ccc;
    padding: 4px 6px;
    min-height: 22px;
  }
  input.ipt_editor {
    width: 100%;
    border: 1px solid #aaa;
    padding: 4px 6px;
    font-family: inherit;
    font-size: 14px;
    min-height: 26px;
  }
  .sign_member {
    display: inline-block;
    border: 1px solid #000;
    width: 56px;
    vertical-align: top;
    margin-left: 1px;
    text-align: center;
  }
  .sign_rank, .sign_wrap, .sign_date {
    border-bottom: 1px solid #000;
    height: 22px;
    font-size: 9pt;
  }
  .sign_wrap { height: 48px; }
  .sign_date { border-bottom: 0; }
  .sign_tit {
    display: inline-block;
    writing-mode: vertical-rl;
    border: 1px solid #000;
    padding: 8px 4px;
    font-weight: bold;
    font-size: 12px;
    margin-right: 2px;
    vertical-align: top;
    height: 92px;
  }
  .sign_group { display: inline-block; text-align: left; vertical-align: top; }
  #bodyEditor {
    width: 100%;
    min-height: 320px;
    border: 1px dashed #bbb;
    padding: 8px;
    outline: none;
    font-size: 14px;
    line-height: 1.6;
    background: #fff;
  }
  #bodyEditor:empty:before {
    content: attr(data-placeholder);
    color: #999;
  }
  .doc-title {
    text-align: center;
    font-size: 36px;
    font-weight: bold;
    height: 90px;
    vertical-align: middle;
    line-height: 90px;
  }
</style>
</head>
<body>
<div id="wrap">
  <table style="width:800px;border:0;margin-top:1px;">
    <colgroup>
      <col width="310" />
      <col width="490" />
    </colgroup>
    <tr>
      <td class="doc-title" colspan="2">업 무 기 안</td>
    </tr>
    <tr>
      <td style="vertical-align:top;border:0;padding:0;">
        <table style="border:1px solid #000;">
          <colgroup>
            <col width="90" />
            <col width="220" />
          </colgroup>
          <tr>
            <td class="th">기안자</td>
            <td class="td"><div class="readonly" id="draftUser">기안자</div></td>
          </tr>
          <tr>
            <td class="th">소속</td>
            <td class="td"><div class="readonly" id="draftDept">기안부서</div></td>
          </tr>
          <tr>
            <td class="th">기안일</td>
            <td class="td"><div class="readonly" id="draftDate">기안일</div></td>
          </tr>
          <tr>
            <td class="th">문서번호</td>
            <td class="td"><div class="readonly" id="docNoDisplay">(기안 후 부여)</div></td>
          </tr>
        </table>
      </td>
      <td style="vertical-align:top;text-align:right;border:0;padding:0;">
        <div class="sign_group">
          <span class="sign_tit">결재</span>
          <span class="sign_member"><div class="sign_rank">&nbsp;</div><div class="sign_wrap">&nbsp;</div><div class="sign_date">&nbsp;</div></span>
          <span class="sign_member"><div class="sign_rank">&nbsp;</div><div class="sign_wrap">&nbsp;</div><div class="sign_date">&nbsp;</div></span>
          <span class="sign_member"><div class="sign_rank">&nbsp;</div><div class="sign_wrap">&nbsp;</div><div class="sign_date">&nbsp;</div></span>
          <span class="sign_member"><div class="sign_rank">&nbsp;</div><div class="sign_wrap">&nbsp;</div><div class="sign_date">&nbsp;</div></span>
          <span class="sign_member"><div class="sign_rank">&nbsp;</div><div class="sign_wrap">&nbsp;</div><div class="sign_date">&nbsp;</div></span>
        </div>
        <div style="margin-top:6px;" class="sign_group">
          <span class="sign_tit" style="height:70px;">합의</span>
          <span class="sign_member"><div class="sign_rank">&nbsp;</div><div class="sign_wrap">&nbsp;</div><div class="sign_date">&nbsp;</div></span>
        </div>
      </td>
    </tr>
  </table>

  <table style="width:800px;border:0;margin-top:10px;">
    <colgroup>
      <col width="120" />
      <col width="680" />
    </colgroup>
    <tr>
      <td class="th" style="font-size:14px;height:25px;">제목</td>
      <td class="td" style="font-size:14px;">
        <input class="ipt_editor" type="text" id="subject" name="subject" placeholder="제목을 입력하세요" />
      </td>
    </tr>
    <tr>
      <td class="td" colspan="2" style="height:350px;vertical-align:top;padding:5px;">
        <div id="bodyEditor" contenteditable="true" data-placeholder="본문을 입력하세요"></div>
      </td>
    </tr>
  </table>
</div>

<script>
(function () {
  function qs(name) {
    try {
      return new URLSearchParams(location.search).get(name) || '';
    } catch (e) {
      return '';
    }
  }

  function applyQuery() {
    var user = qs('user');
    var dept = qs('dept');
    var date = qs('date');
    if (user) document.getElementById('draftUser').textContent = user;
    if (dept) document.getElementById('draftDept').textContent = dept;
    if (date) document.getElementById('draftDate').textContent = date;
  }

  function parseMsg(raw) {
    if (!raw) return null;
    if (typeof raw === 'object') return raw;
    try { return JSON.parse(raw); } catch (e) { return null; }
  }

  function collectFields() {
    return {
      subject: document.getElementById('subject').value || '',
      bodyHtml: document.getElementById('bodyEditor').innerHTML || '',
      draftUser: document.getElementById('draftUser').textContent || '',
      draftDept: document.getElementById('draftDept').textContent || '',
      draftDate: document.getElementById('draftDate').textContent || ''
    };
  }

  /** 다우 appContent 슬롯에 넣을 본문만 */
  function buildContentHtml() {
    var body = document.getElementById('bodyEditor').innerHTML || '';
    var trimmed = body.replace(/<br\s*\/?>/gi, '').replace(/&nbsp;/gi, ' ').trim();
    if (!trimmed) return '';
    return '<div style="font-family:malgun gothic,dotum,sans-serif;font-size:10pt;line-height:1.6;">' +
      body + '</div>';
  }

  window.addEventListener('message', function (ev) {
    var data = parseMsg(ev.data);
    if (!data) return;
    if (data.type === 'yj_eap_init') {
      if (data.user) document.getElementById('draftUser').textContent = data.user;
      if (data.dept) document.getElementById('draftDept').textContent = data.dept;
      if (data.date) document.getElementById('draftDate').textContent = data.date;
      if (typeof data.subject === 'string' && data.subject.length) {
        document.getElementById('subject').value = data.subject;
      }
      if (typeof data.bodyHtml === 'string' && data.bodyHtml.length) {
        document.getElementById('bodyEditor').innerHTML = data.bodyHtml;
      }
      return;
    }
    if (data.type === 'yj_eap_get') {
      var fields = collectFields();
      parent.postMessage(JSON.stringify({
        type: 'yj_eap_content',
        requestId: data.requestId || '',
        title: (fields.subject || '').trim(),
        html: buildContentHtml(),
        fields: fields
      }), '*');
    }
  });

  applyQuery();
  parent.postMessage(JSON.stringify({ type: 'yj_eap_ready' }), '*');
})();
</script>
</body>
</html>
